# 실행: track-b-assignment 디렉터리에서 `docker compose up`
# 인프라(MySQL, Redis)는 준비되어 있다. app 서비스는 specs/006-docker 에서 직접 완성한다.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: brokerage
      MYSQL_USER: brokerage
      MYSQL_PASSWORD: brokerage
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

